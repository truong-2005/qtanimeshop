version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. CONTAINER MYSQL
  # -------------------------------------------------------------
  mysql-db:
    image: mysql:8.0
    container_name: anime-mysql-db
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes" # Cho phép password trống giống local của bạn
      MYSQL_DATABASE: animebackend      # Tự động tạo DB tên là animebackend
    ports:
      - "3306:3306"
    volumes:
      - mysql_anime_data:/var/lib/mysql
    networks:
      - anime-network
    restart: always

  # -------------------------------------------------------------
  # 2. CONTAINER ỨNG DỤNG JAVA (Được build từ Google Jib)
  # -------------------------------------------------------------
  anime-app:
    image: my-animebackend-app:1.0.0 # Tên image bạn cấu hình trong plugin Jib
    container_name: anime-spring-app
    ports:
      - "8083:8083"
    depends_on:
      - mysql-db
    networks:
      - anime-network
    restart: always
    environment:
      # Ghi đè URL kết nối: Đổi 'localhost' thành tên dịch vụ 'mysql-db' của Docker
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/animebackend?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=
      
      # Các biến môi trường khác (Nếu bạn muốn thay đổi lúc chạy container)
      - MAIL_USERNAME=your_email@gmail.com
      - MAIL_PASSWORD=your_mail_password
      - OPENAI_API_KEY=your_openai_key_here
      # - JWT_SECRET=ChuoiSecretMoiNeuMuonThayDoi

volumes:
  mysql_anime_data: # Giúp giữ lại dữ liệu MySQL khi bạn stop/restart container

networks:
  anime-network:
    driver: bridge
