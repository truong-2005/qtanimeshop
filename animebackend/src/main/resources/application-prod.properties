# =========================
# SERVER
# =========================

server.port=${PORT:8083}

# =========================
# MYSQL
# =========================

spring.datasource.url=${MYSQL_URL}

spring.datasource.username=${MYSQL_USERNAME}

spring.datasource.password=${MYSQL_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA
# =========================

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=false

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =========================
# JWT
# =========================

jwt.secret=${JWT_SECRET}

jwt.expiration=604800000

jwt.refresh-expiration=2592000000

# =========================
# MAIL
# =========================

spring.mail.host=smtp.gmail.com

spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}

spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.smtp.starttls.enable=true

# =========================
# GOOGLE LOGIN
# =========================

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.google.redirect-uri=${APP_URL}/login/oauth2/code/google

# =========================
# FACEBOOK LOGIN
# =========================

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_APP_ID}

spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_APP_SECRET}

spring.security.oauth2.client.registration.facebook.scope=email,public_profile

spring.security.oauth2.client.registration.facebook.redirect-uri=${APP_URL}/login/oauth2/code/facebook

spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v19.0/dialog/oauth

spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v19.0/oauth/access_token

spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture

spring.security.oauth2.client.provider.facebook.user-name-attribute=id

oauth2.redirect.frontend-url=${FRONTEND_URL}/oauth2/success

# =========================
# OPENAI
# =========================

openai.api.key=${OPENAI_API_KEY}

# =========================
# VNPAY
# =========================

vnpay.tmn-code=${VNPAY_TMN_CODE}

vnpay.hash-secret=${VNPAY_HASH_SECRET}

vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html

vnpay.return-url=${VNPAY_RETURN_URL}